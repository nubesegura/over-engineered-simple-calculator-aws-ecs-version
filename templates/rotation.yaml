AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Rotation stack (twin of the Terraform unit "rotation", module modules/db-rotation): application secret
  (alternating users) with its resource policy, the rotation function (code in src/rotation/db_rotation,
  packaged with its pinned dependencies by sam build) in the private subnets, its schedule, the error
  alarm and the failed-rotation rule. Terraform aws_secretsmanager_secret and its initial
  aws_secretsmanager_secret_version are one AWS::SecretsManager::Secret here (GenerateSecretString).

Parameters:
  EnvType:
    Type: String
    AllowedValues: [dev, prod]
  Context:
    Type: String
    Default: oecalc
    AllowedPattern: "^[a-z0-9]+$"
  RegionCode:
    Type: String
    AllowedPattern: "^[a-z0-9]+$"
  AppUsername:
    Type: String
    Default: calc_app
    Description: Base database user of the application (the alternate user is <name>_clone)
  LogRetentionDays:
    Type: Number
  EnableXrayTracing:
    Type: String
    AllowedValues: ["true", "false"]
  RotationWindowStartHourUtc:
    Type: Number
    MinValue: 0
    MaxValue: 23
    Description: Start hour (UTC) of the rotation window; it must sit inside the NAT-on hours
  RotationWindowDuration:
    Type: String
    AllowedPattern: "^[0-9]+h$"
    Description: Length of the rotation window (for example 8h); it cannot cross midnight UTC

Conditions:
  XrayEnabled: !Equals [!Ref EnableXrayTracing, "true"]

Resources:
  # ---------------------------------------------------------
  # Application secret. The initial password is generated by Secrets Manager (32 characters, letters and
  # digits only, like the Terraform ephemeral random_password with special = false) and never appears
  # in the template. Rotation replaces it. On stack deletion CloudFormation deletes the secret without
  # a recovery window (ForceDeleteWithoutRecovery).
  # ---------------------------------------------------------
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "sm-${RegionCode}-${Context}-app-${EnvType}"
      Description: Credential of the limited application database user (alternating users, rotated by the db-rotation function)
      KmsKeyId:
        Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-security-${EnvType}:KmsKeyArn"
      GenerateSecretString:
        SecretStringTemplate: !Sub
          - '{"dbname":"${DbName}","engine":"postgres","host":"${DbHost}","port":${DbPort},"username":"${AppUsername}"}'
          - DbName:
              Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-database-${EnvType}:DbName"
            DbHost:
              Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-database-${EnvType}:EndpointAddress"
            DbPort:
              Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-database-${EnvType}:Port"
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # Every secret has a resource policy that refuses non-TLS access (SCRT-06, SCRT-07).
  AppSecretPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref AppSecret
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: secretsmanager:*
            Resource: "*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------------------------------------------------------
  # Rotation function log group and role
  # ---------------------------------------------------------
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${Context}/${EnvType}/lambda/db-rotation"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId:
        Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-security-${EnvType}:KmsKeyArn"

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "iamr-${RegionCode}-${Context}-db-rotation-${EnvType}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  FunctionRolePolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: !Sub "iamp-${RegionCode}-${Context}-db-rotation-${EnvType}"
      RoleName: !Ref FunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RotateApplicationSecret
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
              - secretsmanager:PutSecretValue
              - secretsmanager:UpdateSecretVersionStage
            Resource: !Ref AppSecret
          - Sid: ReadMasterSecret
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-database-${EnvType}:MasterSecretArn"
          - Sid: GenerateRandomPassword
            Effect: Allow
            Action: secretsmanager:GetRandomPassword
            Resource: "*"
          - Sid: UseEnvironmentKey
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource:
              Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-security-${EnvType}:KmsKeyArn"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
          - Sid: VpcNetworkInterfaces
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: "*"
          - Sid: WriteOwnLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub "${FunctionLogGroup.Arn}:*"
          - !If
            - XrayEnabled
            - Sid: XRayTracing
              Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
            - !Ref AWS::NoValue

  # ---------------------------------------------------------
  # Rotation function: private subnets, jobs security group, no reserved concurrency
  # ---------------------------------------------------------
  RotationFunction:
    Type: AWS::Serverless::Function
    DependsOn: FunctionRolePolicy
    Properties:
      FunctionName: !Sub "fnc-${RegionCode}-${Context}-db-rotation-${EnvType}"
      Role: !GetAtt FunctionRole.Arn
      Runtime: python3.14
      Architectures: [arm64]
      Handler: handler.handler
      Timeout: 60
      MemorySize: 256
      CodeUri: ../src/rotation/db_rotation
      Environment:
        Variables:
          MASTER_SECRET_ARN:
            Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-database-${EnvType}:MasterSecretArn"
      VpcConfig:
        SubnetIds: !Split
          - ","
          - Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-network-${EnvType}:PrivateSubnetIds"
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-network-${EnvType}:JobSecurityGroupId"
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref FunctionLogGroup
      Tracing: !If [XrayEnabled, Active, PassThrough]

  # Only Secrets Manager, only for the application secret (LMB-04, LMB-05).
  SecretsManagerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RotationFunction
      Principal: secretsmanager.amazonaws.com
      SourceArn: !Ref AppSecret
      SourceAccount: !Ref AWS::AccountId

  # No rotation at deploy time: the first run needs the application user, which the migration creates
  # after this stack (same as Terraform rotate_immediately = false).
  AppSecretRotation:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: SecretsManagerPermission
    Properties:
      SecretId: !Ref AppSecret
      RotationLambdaARN: !GetAtt RotationFunction.Arn
      RotateImmediatelyOnUpdate: false
      RotationRules:
        ScheduleExpression: !Sub "cron(0 ${RotationWindowStartHourUtc} 1,4,7,10,13,16,19,22,25,28 * ? *)"
        Duration: !Ref RotationWindowDuration

  # ---------------------------------------------------------
  # Alerts: function errors and failed rotations (secrets of this environment) to SNS
  # ---------------------------------------------------------
  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "alrm-${RegionCode}-${Context}-db-rotation-errors-${EnvType}"
      AlarmDescription: "The database rotation function failed: the application credential may not have rotated"
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref RotationFunction
      AlarmActions:
        - Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-security-${EnvType}:AlertTopicArn"

  # Rotation events carry the secret in detail.additionalEventData.SecretId (ARN or name). The prefixes
  # (ARN without the 6-character suffix, and the bare name) match both forms, as in Terraform.
  RotationFailedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "evr-${RegionCode}-${Context}-db-rotation-failed-${EnvType}"
      Description: A Secrets Manager rotation of this environment failed
      EventPattern:
        source: [aws.secretsmanager]
        detail:
          eventSource: [secretsmanager.amazonaws.com]
          eventName: [RotationFailed]
          additionalEventData:
            SecretId:
              - prefix: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sm-${RegionCode}-${Context}-app-${EnvType}"
              - prefix: !Sub "sm-${RegionCode}-${Context}-app-${EnvType}"
              - prefix: !Sub
                  - "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MasterName}"
                  - MasterName:
                      Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-database-${EnvType}:MasterSecretNamePrefix"
              - prefix:
                  Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-database-${EnvType}:MasterSecretNamePrefix"
      Targets:
        - Id: alerts-topic
          Arn:
            Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-security-${EnvType}:AlertTopicArn"
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 3600

Outputs:
  AppSecretArn:
    Value: !Ref AppSecret
    Export:
      Name: !Sub "${AWS::StackName}:AppSecretArn"
  AppSecretName:
    Value: !Sub "sm-${RegionCode}-${Context}-app-${EnvType}"
  FunctionRoleArn:
    Description: ARN of the rotation function role
    Value: !GetAtt FunctionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}:FunctionRoleArn"
  FunctionName:
    Value: !Ref RotationFunction
