[project]
name = "nat_scheduler"
version = "0.1.0"
description = "Lambda that creates and removes the NAT gateway on a schedule"
requires-python = ">=3.14"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "S", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["nat_scheduler"]

[tool.mypy]
strict = true
ignore_missing_imports = true
packages = ["nat_scheduler", "tests"]

[tool.pytest.ini_options]
addopts = "--cov=nat_scheduler --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["."]
